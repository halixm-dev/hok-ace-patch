name: Android APK

on:
  push:
    branches: [master]
    tags: ['android-v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - name: Install build tools
        run: |
          python -m venv .venv
          .venv/Scripts/python.exe -m pip install cffi==2.1.1 setuptools==80.9.0
          if ($LASTEXITCODE -ne 0) { throw 'Python build dependencies failed' }
          & "$env:ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager.bat" 'platforms;android-35' 'build-tools;35.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'
          if ($LASTEXITCODE -ne 0) { throw 'Android SDK installation failed' }
      - name: Build and check development APK
        if: ${{ !startsWith(github.ref, 'refs/tags/android-v') }}
        run: ./tools/ci/build_android.ps1 -VersionCode $([int]$env:GITHUB_RUN_NUMBER + 1)
      - name: Build and check release APK
        if: startsWith(github.ref, 'refs/tags/android-v')
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          if ($env:GITHUB_REF_NAME -notmatch '^android-v[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$') { throw 'Use an android-v1.6.1.1 tag' }
          if ($env:GITHUB_REF_NAME.Substring(9) -ne (Get-Content -LiteralPath VERSION -Raw).Trim()) { throw 'Release tag must match VERSION' }
          if (-not $env:KEYSTORE_BASE64) { throw 'Private Android release signing secrets are missing' }
          $env:ANDROID_RELEASE_KEYSTORE = Join-Path $env:RUNNER_TEMP 'release.keystore'
          try {
            [IO.File]::WriteAllBytes($env:ANDROID_RELEASE_KEYSTORE, [Convert]::FromBase64String($env:KEYSTORE_BASE64))
            ./tools/ci/build_android.ps1 -Variant Release -VersionName $env:GITHUB_REF_NAME.Substring(9) -VersionCode $([int]$env:GITHUB_RUN_NUMBER + 1)
          } finally {
            Remove-Item -LiteralPath $env:ANDROID_RELEASE_KEYSTORE -Force -ErrorAction SilentlyContinue
          }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-apk
          if-no-files-found: error
          retention-days: 14
          path: |
            artifacts/hok-ace-patch.apk
            artifacts/SHA256SUMS
            artifacts/hok-ace-patch-codec-sources.zip
            artifacts/android-native-alignment.json
            android/app/build/reports/release-runtime-dependencies.json
      - name: Retain check reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-check-reports
          if-no-files-found: ignore
          path: |
            android/app/build/reports/
            android/app/build/test-results/

  release:
    if: startsWith(github.ref, 'refs/tags/android-v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # Full history and tags: the notes list the changes since the previous android-v tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: android-apk
          path: download
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          bash tools/ci/release_notes.sh "$RELEASE_TAG" > notes.md
          gh release create "$RELEASE_TAG" --verify-tag --draft --title "HOK ACE Patch ${RELEASE_TAG#android-v}" --notes-file notes.md download/artifacts/hok-ace-patch.apk download/artifacts/SHA256SUMS download/artifacts/hok-ace-patch-codec-sources.zip
