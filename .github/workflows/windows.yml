name: Windows exe

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Builds the exe the way build.bat does and runs its --smoketest, which needs no game dump: a module
  # or codec data the freeze left out (app/build_exe.py) fails here instead of on a user's first texture.
  exe:
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install requirements
        run: |
          python -m venv .venv
          .venv/Scripts/python.exe -m pip install -r requirements.txt
          if ($LASTEXITCODE -ne 0) { throw 'requirements.txt failed to install' }
      # The PC edition's native BC7 mode 7 (crates/hok_bc7): the toolchain its rust-toolchain.toml pins,
      # for x64 like the Python 3.12 above; build.bat then builds it with the crates Cargo.lock locks.
      - name: Install the pinned Rust toolchain
        working-directory: crates/hok_bc7
        run: |
          rustup toolchain install
          if ($LASTEXITCODE -ne 0) { throw 'the pinned Rust toolchain failed to install' }
          rustc --version
      - name: Build the exe
        shell: cmd
        run: build.bat
      - name: Run the frozen smoke test
        run: |
          $exe = 'dist/HOK ACE Language Patcher.exe'
          $out = Join-Path $env:RUNNER_TEMP 'smoke'
          # A --windowed exe detaches from the console, so wait on the process itself.
          Start-Process -FilePath $exe -ArgumentList '--smoketest', "`"$out`"" -Wait
          if (Test-Path "$out.log") { Get-Content "$out.log" }
          $report = Get-Content (Join-Path $out 'smoketest.json') -Raw | ConvertFrom-Json
          $report.passed | ForEach-Object { Write-Host "  ok  $_" }
          if (-not $report.ok) { throw 'The frozen smoke test failed; its traceback is above' }
      - name: Name the Windows release executable
        if: startsWith(github.ref, 'refs/tags/android-v')
        run: Move-Item -LiteralPath 'dist/HOK ACE Language Patcher.exe' -Destination 'dist/hok-ace-patch-windows-x64.exe'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: startsWith(github.ref, 'refs/tags/android-v')
        with:
          name: windows-exe
          path: dist/hok-ace-patch-windows-x64.exe
          if-no-files-found: error
          retention-days: 14
