[package]
name = "hok_bc7"
version = "0.1.0"
edition = "2021"
publish = false
description = "BC7 modes 6, 5, 4 and 7 for the PC edition's atlas ports: a port of tools/bc7_mode6.py's Python modes"
license = "MIT"

[lib]
name = "hok_bc7"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "=0.30.1", features = ["extension-module", "abi3-py312"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
