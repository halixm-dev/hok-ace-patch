[package]
name = "hok_codecs"
version = "0.1.0"
edition = "2024"
publish = false
description = "Python bindings for the HOK ACE Rust codecs"
license = "GPL-3.0-or-later"

[lib]
crate-type = ["cdylib"]

[dependencies]
hokace-codecs = { path = "../../rust/hokace/codecs" }
hokace-core = { path = "../../rust/hokace/core" }
hokace-oodle = { path = "../../rust/hokace/oodle" }
pyo3 = { version = "=0.30.1", features = ["extension-module", "abi3-py312"] }

[target.'cfg(windows)'.dependencies]
hokace-qtsvfs = { path = "../../rust/hokace/qtsvfs" }
indexmap = "2"
serde_json = { version = "1.0.154", features = ["preserve_order"] }

[profile.release]
lto = true
codegen-units = 1

[lints.rust]
unsafe_code = "forbid"
