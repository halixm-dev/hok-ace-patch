[package]
name = "hokace-astcenc"
version = "0.1.0"
description = "Arm astcenc 631fb04e1c4b's LDR compressor in Rust, byte for byte with its scalar Windows build (rust/hokace/astcenc/NOTICE)"
license = "Apache-2.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
bytemuck = { version = "1.25.2", features = ["aarch64_simd"] }

[lints]
workspace = true

[dev-dependencies]
serde_json = "1.0.154"
sha2 = "0.11.2"

[features]
prof = []

[target.'cfg(target_arch = "x86_64")'.dependencies]
safe_arch = { version = "1.2.0", features = ["bytemuck"] }
