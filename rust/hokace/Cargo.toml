# The migration's one workspace (rust/DECISIONS.md, ADR-012): the shared core and, as they arrive, the
# Android library, the Windows exe and the PC edition. It lives in its own folder so the rust-anything
# unit crates beside it (rust/*-rs) keep their own lockfiles until the lift folds them in.
[workspace]
resolver = "3"
members = ["core"]

[workspace.package]
edition = "2024"
rust-version = "1.97"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = true
codegen-units = 1
